  sim.setNumParticles(n);
};
$("reset").onclick = () => sim.reset();

// --- Fullscreen + panel toggle ---
const controlsEl = document.querySelector(".controls");
$("togglePanel").onclick = () => controlsEl.classList.toggle("hidden");
$("toggleFs").onclick = async () => {
  const inFs = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    if (!inFs) {
      const el = document.documentElement;
      await (el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen?.());
    } else {
      await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen?.());
    }
  } catch (_) { /* user-cancelled or unsupported */ }
};
// Keyboard shortcuts: F = fullscreen, C = toggle controls (ignored while typing in inputs)
window.addEventListener("keydown", (e) => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "f" || e.key === "F") $("toggleFs").click();
  else if (e.key === "c" || e.key === "C") $("togglePanel").click();
});

// Presets
const PRESETS = {
  classic: { bg: "#2a0d3e", cold: "#9a0f1a", hot: "#ffcf3a", comp: "#FFE0B0" },
  cosmic:  { bg: "#0d0a2e", cold: "#5e1ab8", hot: "#f068ff", comp: "#E8C0FF" },
  ocean:   { bg: "#031421", cold: "#0a4f8a", hot: "#5be3ff", comp: "#A0D8EF" },
  forest:  { bg: "#0d1f12", cold: "#1f5f2a", hot: "#c9ff5b", comp: "#E0F0A0" },
};
document.querySelectorAll(".preset").forEach((b) => {
  b.onclick = () => {
    const p = PRESETS[b.dataset.preset];
    if (!p) return;
    $("bgColor").value = p.bg;     params.bg   = hexToRgb(p.bg);
    $("coldColor").value = p.cold; params.cold = hexToRgb(p.cold);
    $("hotColor").value = p.hot;   params.hot  = hexToRgb(p.hot);
    if (p.comp) { $("compColor").value = p.comp; params.compressColor = hexToRgb(p.comp); }
  };
});

// --- Mouse / touch "grab" interaction ---
// Clicking and holding inside the lava lamp captures the fluid particles
// nearest to the cursor. While the pointer is held down, those particles
// follow the cursor via a spring + damping force (see sim.applyGrab),
// which composes with the regular SPH physics — gravity, pressure,
// surface tension, etc. all still apply.
(() => {
  const grabRing = $("grabRing");
  let pointerId = null;
  let lastEventTime = 0;
  let lastSimX = 0, lastSimY = 0;
  // We use the canvas getBoundingClientRect each event so the mapping
  // works under fullscreen scaling, devicePixelRatio, and panel toggles.
  // The view of the interior goes through the glass lens (see shader), so
  // map the pointer the same way: grab what you see, not what's behind it.
  function lensToSim(sx, sy) {
    if (params.lens === false) return sx;
    const cx = SIM_W * 0.5, R = bottleHalfFrac(sy / SIM_H) * SIM_W;
    const b = Math.abs(sx - cx);
    if (R <= 1 || b >= R) return sx;
    const sI = b / R, delta = Math.asin(sI) - Math.asin(sI / 1.34);
    const x0 = Math.max(0, b - Math.sqrt(R * R - b * b) * Math.tan(delta));
    return cx + Math.sign(sx - cx) * x0;
  }
  function clientToSim(ev) {
    const rect = canvas.getBoundingClientRect();
    const ax = (ev.clientX - rect.left) * (VIEW_W / rect.width) - VIEW_M;
    const sy = (ev.clientY - rect.top)  * (SIM_H / rect.height);
    // ringX: apparent (on-screen) position for the halo
    return { sx: lensToSim(ax, sy), sy, rect, ringX: ax };
  }
  function placeRing(rect, sx, sy, visible) {
    // grab-ring is absolutely positioned inside .stage (same offset
    // parent as the canvas). Convert sim coords back to CSS pixels
    // relative to the stage by using the canvas offset within the stage.
    const stage = canvas.parentElement;
    const stageRect = stage.getBoundingClientRect();
    const cssX = (rect.left - stageRect.left) + (sx + VIEW_M) * (rect.width / VIEW_W);
    const cssY = (rect.top  - stageRect.top ) + sy * (rect.height / SIM_H);
    const cssDiameter = 2 * sim.grab.radius * (rect.width / VIEW_W);
    grabRing.style.width  = cssDiameter + "px";
    grabRing.style.height = cssDiameter + "px";
    grabRing.style.left = cssX + "px";
    grabRing.style.top  = cssY + "px";
    grabRing.classList.toggle("active", !!visible);
  }

  canvas.addEventListener("pointerdown", (ev) => {
    // Ignore secondary buttons (right-click etc.)
    if (ev.button !== 0 && ev.pointerType === "mouse") return;
    const { sx, sy, rect, ringX } = clientToSim(ev);
    const grabbed = sim.beginGrab(sx, sy);
    if (!grabbed) return; // empty space — let the click do nothing
    pointerId = ev.pointerId;
    canvas.setPointerCapture(pointerId);
    canvas.classList.add("grabbing");
    lastEventTime = performance.now();
    lastSimX = sx; lastSimY = sy;
    placeRing(rect, ringX, sy, true);
    ev.preventDefault();
  });

  canvas.addEventListener("pointermove", (ev) => {
    if (pointerId === null || ev.pointerId !== pointerId) return;
    const now = performance.now();
    const dt = Math.max(0.001, (now - lastEventTime) / 1000);
    const { sx, sy, rect, ringX } = clientToSim(ev);
    const vx = (sx - lastSimX) / dt;
    const vy = (sy - lastSimY) / dt;
    sim.updateGrab(sx, sy, vx, vy);
    lastEventTime = now;
    lastSimX = sx; lastSimY = sy;
    placeRing(rect, ringX, sy, true);
  });

  function releaseGrab() {
    if (pointerId !== null) {
      try { canvas.releasePointerCapture(pointerId); } catch (_) {}
    }
    pointerId = null;
    canvas.classList.remove("grabbing");
    grabRing.classList.remove("active");
    sim.endGrab();
  }
  canvas.addEventListener("pointerup",     releaseGrab);
  canvas.addEventListener("pointercancel", releaseGrab);
  // If the mouse leaves while not actually capturing (e.g. user
  // released outside the window), make sure we clean up.
  window.addEventListener("blur", releaseGrab);
})();

// --- Main loop ---
let last = performance.now();
let frames = 0;
let fpsTime = last;
let paused = false;

// Adaptive quality: every ~1 s look at the average frame interval. Too slow
// → shade fewer pixels; comfortably at 60 fps for a while → try more. After
// a downgrade we wait before probing upward again; if a probe fails right
// away the wait doubles (up to ~1 min), so a device sitting on the edge
// doesn't stutter every few seconds.
const FRAME_MS = 1000 / 60;
const quality = { sum: 0, count: 0, goodWindows: 0, holdOff: 0, warmup: 30,
                  backoff: 8, sinceUpgrade: 99 };
let nextFrameAt = 0;
function adaptQuality(frameMs) {
  if (pinnedScale > 0) return;
  if (quality.warmup > 0) { quality.warmup--; return; }   // shader compile, JIT
  quality.sum += frameMs;
  quality.count++;
  if (quality.sum < 1000) return;
  const avg = quality.sum / quality.count;
  quality.sum = 0; quality.count = 0;
  if (quality.holdOff > 0) quality.holdOff--;
  quality.sinceUpgrade++;
  if (avg > FRAME_MS * 1.1 && renderScale > MIN_SCALE) {        // under ~54 fps
    renderScale = Math.max(MIN_SCALE, renderScale * 0.85);
    quality.goodWindows = 0;
    quality.backoff = quality.sinceUpgrade <= 2 ? Math.min(64, quality.backoff * 2) : 8;
    quality.holdOff = quality.backoff;
    sizeCanvas();
  } else if (avg < FRAME_MS * 1.06) {
    quality.goodWindows++;
    if (quality.goodWindows >= 3 && quality.holdOff === 0 && renderScale < 1) {
      renderScale = Math.min(1, renderScale * 1.1);
      quality.goodWindows = 0;
      quality.sinceUpgrade = 0;
      sizeCanvas();
    }
  } else {
    quality.goodWindows = 0;
  }
}

// Pause simulation when tab is hidden to save CPU/GPU
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    paused = true;
  } else {
    paused = false;
    last = performance.now(); // reset dt so we don't get a huge jump
    nextFrameAt = 0;
    quality.sum = 0; quality.count = 0; quality.warmup = 10;
  }
});

// ---- Fixed physics timestep ----
// The sim always advances in identical frames of PHYS_DT (one regroup +
// 5 substeps). Letting the step follow the display frame rate made the
// fluid behave differently per device: at 30 fps a quarter of the wax
// ended up in 80+ particle blobs, at 60 fps none. Rendering interpolates
// positions between the last two physics frames, so motion stays smooth
// at any frame rate or Speed setting.
const PHYS_DT = 1 / 60;
const SUBSTEPS = 5;
const MAX_PHYS_FRAMES = 4;          // per render; beyond this we slow down
let physAcc = 0;
let interpX = null, interpY = null, prevX = null, prevY = null;
let interpN = -1, interpReset = -1;
function stepPhysics(rawDt) {
  const n = sim.n;
  if (!interpX || interpX.length < sim.cap) {
    interpX = new Float32Array(sim.cap); interpY = new Float32Array(sim.cap);
    prevX = new Float32Array(sim.cap);   prevY = new Float32Array(sim.cap);
  }
  if (n !== interpN || sim.resetCount !== interpReset) {
    prevX.set(sim.x.subarray(0, n)); prevY.set(sim.y.subarray(0, n));
    interpN = n; interpReset = sim.resetCount; physAcc = 0;
  }
  physAcc += Math.min(0.1, rawDt) * sim.timeScale;
  let steps = 0;
  while (physAcc >= PHYS_DT) {
    if (steps === MAX_PHYS_FRAMES) { physAcc = 0; break; }
    prevX.set(sim.x.subarray(0, n)); prevY.set(sim.y.subarray(0, n));
    sim.stepFrame(PHYS_DT);
    for (let i = 0; i < SUBSTEPS; i++) {
      sim.step(PHYS_DT / SUBSTEPS);
      sim.applyGrab(PHYS_DT / SUBSTEPS);
    }
    physAcc -= PHYS_DT;
    steps++;
  }
  const a = physAcc / PHYS_DT;
  for (let i = 0; i < n; i++) {
    interpX[i] = prevX[i] + (sim.x[i] - prevX[i]) * a;
    interpY[i] = prevY[i] + (sim.y[i] - prevY[i]) * a;
  }
  params.px = interpX; params.py = interpY;
}

function frame(now) {
  if (paused) { requestAnimationFrame(frame); return; }
  // Cap at ~60 fps: on 90/120 Hz screens rAF fires more often, which would
  // multiply the sim + shading work for no visible benefit. Pacing against
  // a schedule (rather than "skip if < 16 ms") averages 60 fps at 90 Hz too.
  if (now < nextFrameAt - 1) { requestAnimationFrame(frame); return; }
  nextFrameAt = Math.max(nextFrameAt + FRAME_MS, now - FRAME_MS);
  const rawDt = (now - last) / 1000;
  adaptQuality(now - last);
  last = now;
  stepPhysics(rawDt);

  params.time = now / 1000;
  params.quality = renderScale;
  renderer.render(sim, params);

  frames++;
  if (now - fpsTime > 500) {
    const fps = Math.round((frames * 1000) / (now - fpsTime));
    $("fpsText").textContent = fps + " fps · " + Math.round(renderScale * 100) + "% res";
    $("partText").textContent = sim.n + " particles";
    frames = 0;
    fpsTime = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// -------- Benchmark mode (?bench=<seconds>) --------
// Records every rAF timestamp for the configured duration, then writes a
// summary to document.title and an on-page panel. First 60 frames are
// dropped as JIT warmup. Read progress externally via the tab title.
(() => {
  const benchSec = parseFloat(new URLSearchParams(location.search).get("bench"));
  if (!benchSec || benchSec <= 0) return;
  const WARMUP_FRAMES = 60;
  const ts = [];   // rAF timestamps after warmup
  let warm = 0;
  let lastTitleSec = -1;
  let benchStart = -1;
  function pct(sortedArr, p) {
    return sortedArr[Math.min(sortedArr.length - 1, Math.floor(sortedArr.length * p))];
  }
  function snapshotStats(timestamps) {
    if (timestamps.length < 2) return null;
    const ft = new Float64Array(timestamps.length - 1);
    for (let i = 1; i < timestamps.length; i++) ft[i - 1] = timestamps[i] - timestamps[i - 1];
    const sorted = Array.from(ft).sort((a, b) => a - b);
    const sum = sorted.reduce((a, b) => a + b, 0);
    const mean = sum / sorted.length;
    return {
      frames: ft.length,
      sec: sum / 1000,
      fps: ft.length / (sum / 1000),
      mean, min: sorted[0], max: sorted[sorted.length - 1],
      p50: pct(sorted, 0.50), p95: pct(sorted, 0.95), p99: pct(sorted, 0.99),
    };
  }
  function fmt(s) {
    return `frames=${s.frames} sec=${s.sec.toFixed(1)} fps=${s.fps.toFixed(1)} `
      + `mean=${s.mean.toFixed(2)}ms p50=${s.p50.toFixed(2)} p95=${s.p95.toFixed(2)} `
      + `p99=${s.p99.toFixed(2)} min=${s.min.toFixed(2)} max=${s.max.toFixed(2)} n=${sim.n}`;
  }
  function tick(now) {
    if (warm < WARMUP_FRAMES) { warm++; requestAnimationFrame(tick); return; }
    if (benchStart < 0) benchStart = now;
    ts.push(now);
    const elapsed = (now - benchStart) / 1000;
    if (elapsed >= benchSec) {
      const s = snapshotStats(ts);
      const summary = "BENCH " + fmt(s);
      document.title = summary;
      const div = document.createElement("div");
      div.id = "__benchPanel";
      div.style.cssText = "position:fixed;top:10px;left:10px;right:10px;z-index:9999;"
        + "background:#0f1f10;color:#a8ffa8;font:12px ui-monospace,monospace;"
        + "padding:12px 14px;border:1px solid #5fbf60;border-radius:8px;"
        + "white-space:pre-wrap;";
      div.textContent = summary;
      document.body.appendChild(div);
      console.log(summary);
      return;  // stop bench loop; main frame() loop continues
    }
    const sec = Math.floor(elapsed);
    if (sec !== lastTitleSec) {
      lastTitleSec = sec;
      const s = snapshotStats(ts);
      if (s) document.title = `bench t=${sec}/${benchSec}s ${fmt(s)}`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
