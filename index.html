<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lava Lamp — SPH Fluid Simulation</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="toolbar">
  <button id="togglePanel" title="Toggle controls (C)" aria-label="Toggle controls">&#x2261;</button>
  <button id="toggleFs" title="Fullscreen (F)" aria-label="Fullscreen">&#x26F6;</button>
</div>

<div class="stage">
  <canvas id="lava" width="760" height="1400"></canvas>
  <div id="grabRing" class="grab-ring"></div>
</div>

<div class="controls">
  <h1>Lava Lamp</h1>

  <div class="preset-row">
    <button class="preset" data-preset="classic">Classic</button>
    <button class="preset" data-preset="cosmic">Cosmic</button>
    <button class="preset" data-preset="ocean">Ocean</button>
    <button class="preset" data-preset="forest">Forest</button>
  </div>

  <div class="row">
    <div class="control">
      <label>Background</label>
      <input type="color" id="bgColor" value="#2a0d3e" />
    </div>
    <div class="control">
      <label>Cold wax</label>
      <input type="color" id="coldColor" value="#9a0f1a" />
    </div>
    <div class="control">
      <label>Hot wax</label>
      <input type="color" id="hotColor" value="#ffcf3a" />
    </div>
    <div class="control">
      <label>Compress</label>
      <input type="color" id="compColor" value="#FFE0B0" />
    </div>
  </div>

  <div class="control">
    <label>Bulb glow <span class="val" id="glowVal">0.38</span></label>
    <input type="range" id="glow" min="0" max="1" step="0.01" value="0.38" />
  </div>

  <div class="control">
    <label>Speed <span class="val" id="speedVal">1.00</span></label>
    <input type="range" id="speed" min="0.05" max="2.0" step="0.01" value="1.00" />
  </div>

  <div class="control">
    <label>Buoyancy <span class="val" id="sgVal">1.50</span></label>
    <input type="range" id="sg" min="0.2" max="8.0" step="0.05" value="1.50" />
  </div>

  <div class="control">
    <label>Heat <span class="val" id="heatVal">4.50</span></label>
    <input type="range" id="heat" min="0.05" max="8.0" step="0.01" value="4.50" />
  </div>

  <div class="control">
    <label>Heater height <span class="val" id="bulbVal">58</span></label>
    <input type="range" id="bulb" min="20" max="260" step="1" value="58" />
  </div>

  <div class="control">
    <label>Heater spread <span class="val" id="edgeVal">0.30</span></label>
    <input type="range" id="edge" min="0" max="1.0" step="0.01" value="0.30" />
  </div>

  <div class="control">
    <label>Heat mixing <span class="val" id="diffVal">5.00</span></label>
    <input type="range" id="diff" min="0" max="6.0" step="0.05" value="5.00" />
  </div>

  <div class="control">
    <label>Heat flicker <span class="val" id="noiseVal">0.50</span></label>
    <input type="range" id="noise" min="0" max="2.0" step="0.01" value="0.50" />
  </div>

  <div class="control">
    <label>Cooling <span class="val" id="acoolVal">3.50</span></label>
    <input type="range" id="acool" min="0" max="8.0" step="0.05" value="3.50" />
  </div>

  <div class="control">
    <label>Bounce <span class="val" id="stVal">1.00</span></label>
    <input type="range" id="st" min="0" max="5.0" step="0.01" value="1.00" />
  </div>

  <div class="control">
    <label>Phase separation <span class="val" id="trVal">0.05</span></label>
    <input type="range" id="tr" min="0" max="15" step="0.1" value="0.05" />
  </div>

  <div class="control">
    <label>Surface tension <span class="val" id="stenVal">5.00</span></label>
    <input type="range" id="sten" min="0" max="8.0" step="0.05" value="5.00" />
  </div>

  <div class="control">
    <label>Spring strength <span class="val" id="springVal">12.00</span></label>
    <input type="range" id="spring" min="0" max="20.0" step="0.05" value="12.00" />
  </div>

  <div class="control" style="margin-bottom:2px">
    <label>Pool spring zone <span class="val" id="poolZoneVal">480–580</span></label>
  </div>
  <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">
    <canvas id="poolRampViz" width="200" height="60" style="border:1px solid rgba(255,255,255,0.15);border-radius:4px;flex-shrink:0"></canvas>
    <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0">
      <div class="control" style="margin:0">
        <label style="font-size:10px">Top (Lo) <span class="val" id="poolLoVal">480</span></label>
        <input type="range" id="poolLo" min="300" max="600" step="5" value="480" />
      </div>
      <div class="control" style="margin:0">
        <label style="font-size:10px">Bottom (Hi) <span class="val" id="poolHiVal">580</span></label>
        <input type="range" id="poolHi" min="350" max="650" step="5" value="580" />
      </div>
      <div class="control" style="margin:0">
        <label style="font-size:10px">Atten <span class="val" id="poolAttenVal">0.60</span></label>
        <input type="range" id="poolAtten" min="0" max="1.0" step="0.05" value="0.60" />
      </div>
    </div>
  </div>

  <div class="control">
    <label>Floor pull <span class="val" id="stickyVal">0.80</span></label>
    <input type="range" id="sticky" min="0" max="3.0" step="0.01" value="0.80" />
  </div>

  <div class="control">
    <label>Wax size <span class="val" id="sizeVal">1.30</span></label>
    <input type="range" id="size" min="0.7" max="2.0" step="0.01" value="1.30" />
  </div>

  <div class="control">
    <label>Mass <span class="val" id="massVal">0.90</span></label>
    <input type="range" id="mass" min="0.5" max="10.0" step="0.1" value="0.90" />
  </div>

  <div class="control">
    <label>Internal pressure <span class="val" id="pressureVal">5.00</span></label>
    <input type="range" id="pressure" min="0" max="8.0" step="0.05" value="5.00" />
  </div>

  <div class="control">
    <label>Viscosity <span class="val" id="viscVal">0.50</span></label>
    <input type="range" id="visc" min="0" max="6.0" step="0.05" value="0.50" />
  </div>

  <div class="control">
    <label>Particle count <span class="val" id="countVal">160</span></label>
    <input type="range" id="count" min="60" max="600" step="10" value="160" />
  </div>

  <div class="control" style="display:flex;align-items:center;gap:6px">
    <input type="checkbox" id="volAbsorb" checked />
    <label for="volAbsorb" style="cursor:pointer">Volumetric absorption</label>
  </div>
  <div class="control" style="display:flex;align-items:center;gap:6px">
    <input type="checkbox" id="caustics" checked />
    <label for="caustics" style="cursor:pointer">Caustics</label>
  </div>
  <div class="control" style="display:flex;align-items:center;gap:6px">
    <input type="checkbox" id="glassLens" checked />
    <label for="glassLens" style="cursor:pointer">Glass lens</label>
  </div>
  <div class="control" style="display:flex;align-items:center;gap:6px">
    <input type="checkbox" id="bloom" checked />
    <label for="bloom" style="cursor:pointer">Bloom</label>
  </div>
  <div class="control" style="display:flex;align-items:center;gap:6px">
    <input type="checkbox" id="wallLight" checked />
    <label for="wallLight" style="cursor:pointer">Light on wall behind</label>
  </div>
  <div class="control" style="display:flex;align-items:center;gap:6px">
    <input type="checkbox" id="wallFull" checked />
    <label for="wallFull" style="cursor:pointer">Show full wall light (not just changes)</label>
  </div>
  <div class="control" style="display:flex;align-items:center;gap:6px">
    <input type="checkbox" id="taa" checked />
    <label for="taa" style="cursor:pointer">Temporal smoothing (TAA)</label>
  </div>
  <div class="control" style="display:flex;align-items:center;gap:6px">
    <input type="checkbox" id="denoise" checked />
    <label for="denoise" style="cursor:pointer">Denoise light (with TAA)</label>
  </div>
  <div class="control">
    <label>Light rays <span class="val" id="raysVal">—</span></label>
    <input type="range" id="rays" min="0.25" max="2" step="0.05" value="1" />
  </div>

  <button id="reset">Reset simulation</button>

  <div class="stats">
    <span id="fpsText">— fps</span>
    <span id="partText">— particles</span>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
